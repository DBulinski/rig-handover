# Plan morning-digest § 3 / § 4. Saves /digest/<night> as one HTML file and puts it on GitHub
# Pages. The preview is built here, never committed (ADR 0003). Run it again with an empty
# marker to take the marker off the same link.
name: preview

on:
  workflow_dispatch:
    inputs:
      night:
        description: Night to preview (YYYY-MM-DD)
        default: '2026-10-28'
      marker:
        description: LANE_MARKER for the banner; leave empty for "no marker set"
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install
      - name: Save the page
        env:
          LANE_MARKER: ${{ inputs.marker }}
          NIGHT: ${{ inputs.night }}
        run: |
          pnpm start &
          for i in $(seq 1 30); do curl -sf localhost:8787/health && break; sleep 1; done
          mkdir -p _site
          curl -sf "localhost:8787/digest/$NIGHT" -o _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - id: deploy
        uses: actions/deploy-pages@v4
